# @package _global_
defaults:
  - /task/sharpa_inhand/base
  - _self_

training:
  task_name: SharpaInhandRotation
  sim_backend: mujoco
  render_spacing: 0.5
  cam_distance: 1.5
  cam_lookat: [0.75, 0.75, 0.4]
  cam_elevation: -20.0

algo:
  num_envs: 2048
  num_steps_per_env: 8
  max_iterations: 301
  empirical_normalization: true
  policy:
    actor_hidden_dims: [512, 256, 128]
    critic_hidden_dims: [512, 256, 128]
  algorithm:
    value_loss_coef: 4.0
    entropy_coef: 0.01
    learning_rate: 0.001
    desired_kl: 0.02
    num_learning_epochs: 5
    num_mini_batches: 4
    clip_param: 0.2
    gamma: 0.99
    lam: 0.95
  save_interval: 50
