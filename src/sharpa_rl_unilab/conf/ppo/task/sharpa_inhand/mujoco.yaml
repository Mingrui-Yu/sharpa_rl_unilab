# @package _global_
defaults:
  - /common/sharpa_inhand
  - _self_
algo:
  num_envs: ${training.num_envs}
  num_steps_per_env: 8
  max_iterations: 501
  save_interval: 50
  checkpoint: null
  algorithm:
    value_loss_coef: 4.0
    entropy_coef: 0.01
    learning_rate: 0.001
    desired_kl: 0.02
    kl_mode: exact  # Same scheduler KL options as APPO: exact or log_epsilon.
    num_learning_epochs: 5
    num_mini_batches: 4
    clip_param: 0.2
    gamma: 0.99
    lam: 0.95
