# @package _global_
defaults:
- /task/sharpa_inhand/base
- _self_
training:
  task_name: SharpaInhandRotationGrasp
  sim_backend: mujoco
  render_spacing: 0.5
  cam_distance: 1.5
  cam_lookat:
  - 0.75
  - 0.75
  - 0.4
  cam_elevation: -20.0
algo:
  num_envs: 2048
  num_steps_per_env: 8
  max_iterations: 2290
  empirical_normalization: true
  policy:
    actor_hidden_dims:
    - 512
    - 256
    - 128
    critic_hidden_dims:
    - 512
    - 256
    - 128
  algorithm:
    value_loss_coef: 4.0
    entropy_coef: 0.0
    learning_rate: 0.005
    desired_kl: 0.02
    num_learning_epochs: 5
    num_mini_batches: 4
    clip_param: 0.2
    gamma: 0.99
    lam: 0.95
  save_interval: 100
env:
  max_episode_seconds: 3.0
  actions:
    hand:
      zero_action: true
  events:
    reset:
      func: sharpa_rl_unilab.tasks.sharpa_inhand.manager_terms.SharpaGraspReset
      params:
        entity_name: robot
        action_name: hand
        actuator_names:
        - .*_ctrl
        grasp_generation: true
        grasp_pose_noise: 0.15
        reset_height_band: 0.01
        rotation_axis:
        - 0.0
        - 0.0
        - 1.0
        use_default_object_pose_for_object_pos_anchor: true
    domain_randomization:
      params:
        randomize_pd_gains: false
        randomize_friction: false
        randomize_mass: true
        mass_range:
        - 0.05
        - 0.051
        randomize_com: false
        randomize_gravity_direction: false
    persistent_force: null
  terminations:
    dropped: null
    grasp_quality:
      func: sharpa_rl_unilab.tasks.sharpa_inhand.manager_terms.SharpaGraspQualityTermination
      params:
        observation_group: flat
        observation_term: privileged
        event_state_name: reset
        reset_height_band: 0.01
        maximum_orientation_error: 0.5235987755982988
        minimum_contacts: 3
    time_out:
      func: unilab.envs.mdp.time_out
      time_out: true
  recorders:
    grasp_cache:
      func: sharpa_rl_unilab.tasks.sharpa_inhand.manager_terms.SharpaGraspRecorder
      params:
        entity_name: robot
        event_state_name: reset
        termination_term_name: grasp_quality
        observation_group: flat
        observation_term: privileged
        output_prefix: caches/sharpa_grasp_linspace
        target: 10000
        auto_save: true
reward:
  rotate:
    weight: 0.0
  obj_linvel:
    weight: 0.0
  pose_diff:
    weight: 0.0
  torque:
    weight: 0.0
  work:
    weight: 0.0
  object_pos:
    weight: 0.0
