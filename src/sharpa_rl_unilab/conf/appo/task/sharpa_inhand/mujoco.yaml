# @package _global_
defaults:
  - /task/sharpa_inhand/base
  - _self_

training:
  task_name: SharpaInhandRotation
  sim_backend: mujoco
  play_steps: 200
  render_spacing: 0.5
  cam_distance: 1.5
  cam_lookat: [0.75, 0.75, 0.4]
  cam_elevation: -20.0

algo:
  num_envs: 16384
  steps_per_env: 8
  max_iterations: 301
  save_interval: 50
  actor:
    hidden_dims: [512, 256, 128]
    activation: elu
    obs_normalization: true
    distribution_cfg:
      class_name: rsl_rl.modules.distribution.GaussianDistribution
      init_std: 1.0
      std_type: scalar
  critic:
    hidden_dims: [512, 256, 128]
    activation: elu
    obs_normalization: true
  algorithm:
    value_loss_coef: 4.0
    entropy_coef: 0.01
    learning_rate: 0.001
    desired_kl: 0.02
    adaptive_kl_factor: 1.2
    adaptive_lr_factor: 1.1
    num_learning_epochs: 5
    num_mini_batches: 4
    clip_param: 0.2
    gamma: 0.99
    lam: 0.95
