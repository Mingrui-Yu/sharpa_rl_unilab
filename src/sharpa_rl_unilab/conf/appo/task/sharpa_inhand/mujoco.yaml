# @package _global_
defaults:
  - /common/sharpa_inhand
  - _self_
algo:
  num_envs: ${training.num_envs}
  steps_per_env: 8
  max_iterations: 501
  save_interval: 50
  checkpoint: null
  staging_pool_size: 8
  async_queue_size: 4
  collector_device: null  # Follow the resolved learner device.
  collector_seed: null  # Resolved to seed + 1 at runtime.
  algorithm:
    value_loss_coef: 4.0
    entropy_coef: 0.01
    learning_rate: 0.001
    desired_kl: 0.04
    num_learning_epochs: 5
    num_mini_batches: 4
    clip_param: 0.2
    gamma: 0.99
    lam: 0.95
    adaptive_kl_factor: 1.2
    adaptive_lr_factor: 1.1
protocol:
  appo_baseline: appo-hora-790ae32
