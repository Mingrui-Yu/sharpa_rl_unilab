defaults:
  - _self_
  - task: sharpa_inhand/mujoco
algo:
  algo: appo
  seed: 1
  algorithm:
    max_grad_norm: 1.0
    use_clipped_value_loss: true
    schedule: adaptive
    kl_mode: exact  # exact: analytic KL; log_epsilon: legacy formula with +1e-5.
    optimizer: adam
    tau: 1.0
    target_update_freq: 1
    vtrace_clip_rho: 1.0
    vtrace_clip_c: 1.0
    enable_compile: false
hydra:
  searchpath:
    - pkg://sharpa_rl_unilab.conf
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
  job_logging:
    root:
      handlers: [console]
