# @package _global_
defaults:
  - /common/sharpa_inhand
  - _self_

algo:
  num_envs: ${training.num_envs}
  max_iterations: 3000
  save_interval: 1000
  checkpoint: null
  single_stage: false
  buffer_steps: 1000
  warmup_steps: 64
  utd: 1.6
  wm_only_iters: 100
  wm_window: 8
  wm_batches: 10
  wm_batch: 2048
  wm_hidden: [2048, 2048, 2048]
  wm_structured: true
  wm_drift_w: 0.625
  pi_batch: 1024
  horizon: 32
  critic_epochs: 5
  critic_minibatches: 4
  gamma: 0.99
  lam: 0.95
  learning_rate: 0.0004
  pi_opt: muon  # muon / adam; hidden actor matrices use Muon, other tensors Adam
  wm_opt: muon  # muon / adam; hidden world-model matrices use Muon, other tensors Adam
  action_noise: 0.1
  pi_ema: 0.995
  use_amp: true
  compile: true

model:
  action_mapping: tanh
  std_mode: state_independent
  std_parameterization: log
